<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="雲端遛狗"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雲端遛狗 Cloud Walkies</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=LXGW+WenKai+TC&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!--
  雲端遛狗 · 設定區
  1. GOOGLE_KEY：可以留空。留空會用 Google 街景的公開嵌入網址；
     想要更穩定，可以到 Google Cloud 開啟「Maps Embed API」（免費），把金鑰貼在這裡。
  2. FIREBASE：可以留空。留空的話只能自己玩；填入 Firebase 設定後，
     同時在線上的朋友會在地圖上看到彼此，還能互相汪一聲。
  去背使用 @imgly/background-removal（AGPL-3.0 授權），在瀏覽器裡執行，照片不會上傳到伺服器。
-->
<script>
const GOOGLE_KEY = "";
const MAPILLARY_TOKEN = ""; /* 已停用 */
const PEXELS_KEY = ""; /* Pexels 免費 API 金鑰（目前暫停申請） */
const UNSPLASH_KEY = "VyoRGmTXlqeQrDwPQMeRADk1BhPoMaLxTW3vABRZgRs"; /* Unsplash 免費 Access Key：景點的漂亮照片 */ /* 手機拍照模式用的免費街景（Mapillary 開發者代碼，MLY| 開頭） */
const FIREBASE = null; /* 例如：{apiKey:"...",authDomain:"...",databaseURL:"https://xxx.firebaseio.com",projectId:"..."} */
</script>
<style>
:root{--ink:#2b2622;--muted:#8a7f72;--card:#fffdf8;--line:#ece3d3;--accent:#ff7a3d;--accent2:#ffb340;--green:#3fae6a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--ink);background:#222}
#map{position:fixed;inset:0}
button{font:inherit;border:0;cursor:pointer;color:inherit}
#top{position:fixed;left:10px;right:10px;top:calc(10px + var(--sat));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:1000}
.pill{pointer-events:auto;background:rgba(255,253,248,.95);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:8px 12px}
#who{flex:1;display:flex;align-items:center;gap:10px;min-width:96px}@media(max-width:420px){#top .iconbtn{width:40px;height:40px;font-size:18px}#top{gap:6px}}
#who .av{width:42px;height:42px;border-radius:50%;background:#ffe9d6;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:24px}
#who .av img{height:46px}
#who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#online{font-size:12px;font-weight:700;white-space:nowrap;align-self:center}
#online i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:5px;vertical-align:1px}
#online.on i{background:var(--green)}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,253,248,.95);box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:20px;display:flex;align-items:center;justify-content:center}
#bottom{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--sab));z-index:1000;display:flex;gap:10px;align-items:center}
#go{flex:1;height:58px;border-radius:29px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 22px rgba(255,110,40,.45);letter-spacing:1px}
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sab));z-index:1000;background:rgba(43,38,34,.88);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(76px + var(--sat));transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:3000;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sheetbg{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:2800;display:none;align-items:flex-end;justify-content:center}
.sheetbg.show{display:flex}.sheetbg.mid{align-items:center}
.sheet{width:100%;max-width:560px;max-height:88vh;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--sab));overflow:auto;animation:up .25s ease}
.sheet.center{border-radius:24px;margin:auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:2px 0 4px;font-size:20px;font-weight:900}
.sub{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;padding:9px 0;border-radius:12px;background:#f3ece0;font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff}
.grp{font-size:12px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:7px;width:100%;text-align:left}
.row .em{font-size:22px;width:30px;text-align:center}.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:15px}.row .tx small{color:var(--muted);font-size:12px}.row .chain{font-size:15px;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.modes button{padding:14px 4px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px}
.modes button span{display:block;font-size:28px;margin-bottom:4px}
.modes button.rec{border-color:var(--accent);background:#fff4ec}
.modes button:disabled{opacity:.35}
.modes button em{display:block;font-style:normal;font-size:11px;color:var(--accent);margin-top:2px}
.big{width:100%;height:52px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:17px;margin-top:8px}
.big:disabled{opacity:.5}
.ghost{width:100%;height:46px;border-radius:23px;background:#f3ece0;font-weight:700;margin-top:8px}
.legs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.legs div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px}
.legs div span{font-size:22px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.slot{position:relative;aspect-ratio:3/4;border-radius:16px;background:repeating-conic-gradient(#f3ece0 0 25%,#fbf7ef 0 50%) 50%/16px 16px;border:2px solid #e0d4c0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.slot img{max-width:92%;max-height:78%;margin-bottom:28px;object-fit:contain}
.slot input{position:absolute;left:4px;right:4px;bottom:4px;width:calc(100% - 8px);border:0;border-radius:8px;padding:4px 6px;font:inherit;font-size:12px;text-align:center;background:rgba(255,255,255,.95)}
.slot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.slot .ty{position:absolute;top:4px;left:4px;border-radius:10px;background:rgba(255,255,255,.95);font-size:12px;padding:2px 6px}
.slot.add{border-style:dashed;align-items:center;flex-direction:column;justify-content:center;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.slot.add span{font-size:30px}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,253,248,.9);font-size:12px;color:var(--muted);gap:6px;text-align:center;padding:6px}
.spin{width:26px;height:26px;border:3px solid #eadfcc;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tips{background:#fff4ec;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#8a5a3a}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;margin:6px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat div span{font-size:20px;display:block}.stat div b{font-size:16px;display:block}.stat div small{color:var(--muted);font-size:11px}
.met{display:flex;flex-wrap:wrap;gap:6px}.met span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:13px}
.meet{text-align:center}.meet img{height:150px;object-fit:contain}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts button{padding:12px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.acts button span{display:block;font-size:24px}
/* 地圖上的隊伍 */
.teammk{position:relative;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.teammk img{height:56px;margin:0 -8px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)) drop-shadow(0 0 1px #fff)}
.teammk img.p{height:76px}
.teammk .nm{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);background:rgba(43,38,34,.85);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.teammk .veh{position:absolute;right:-18px;bottom:-6px;background:#fff;border:3px solid var(--accent);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.teammk.moving img{animation:hop .38s ease-in-out infinite alternate}
.teammk.moving img:nth-child(2n){animation-delay:.19s}
@keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
.spotmk{background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-tooltip.lbl{background:rgba(255,253,248,.92);border:0;box-shadow:none;font-weight:700;font-family:inherit;color:#5a4a3a;padding:1px 6px}
.leaflet-tooltip.lbl:before{display:none}
/* 街景散步 */
#sv{position:fixed;inset:0;z-index:1500;display:none;background:#111}
#sv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .6s}#sv iframe.hid{pointer-events:none;z-index:0}#sv iframe.vis{z-index:1}
#sv .shade,#svTop,#svTeam,#svBubble,#svGuide,#critter,#critCard{z-index:2}#svCtl{z-index:5}#svTop{z-index:4}
#svTeam.arrange img{pointer-events:auto;outline:2px dashed rgba(255,255,255,.55);outline-offset:3px}#svTeam.arrange img.sel{outline:3px solid #ffb340}
#svGest{position:absolute;inset:0;z-index:2;display:none;touch-action:none}#sv.arranging #svGest{display:block}
#gestTip{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:4;background:rgba(43,38,34,.82);color:#fff;font-size:12px;font-weight:700;border-radius:12px;padding:6px 12px;white-space:nowrap;pointer-events:none;display:none}#sv.arranging #gestTip{display:block}
#shotUI{position:absolute;inset:0;z-index:20;display:none}#shotUI i{position:absolute;left:0;right:0;height:6px;background:#ff00ff}#shotUI .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(43,38,34,.9);color:#fff;border-radius:16px;padding:14px 18px;font-size:14px;line-height:1.6;text-align:center;width:min(82vw,330px);transition:opacity .5s}
#sv.shooting>*:not(iframe):not(#shotUI){visibility:hidden!important}#sv.shooting #shotUI{display:block}
#mlyView{position:absolute;inset:0;z-index:1;display:none;background:#111;touch-action:none;overflow:hidden}#sv.pm-mly #mlyView{display:block}
#mlyCv,#mlyFlat{position:absolute;left:0;top:0;width:100%;height:100%;display:none}#mlyFlat{object-fit:cover;transform-origin:50% 50%}
#mlyCredit{position:absolute;right:8px;bottom:calc(96px + var(--sab));font-size:10px;color:#fff;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
#pmBar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(14px + var(--sab));background:linear-gradient(transparent,rgba(0,0,0,.45))}
#sv.photomode #pmBar{display:flex}#pmBar button{width:46px;height:46px;border-radius:50%;background:rgba(255,253,248,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#pmInfo{flex:1;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;line-height:1.35}
#pmShot{width:72px!important;height:72px!important;border:5px solid #fff!important;background:rgba(255,255,255,.35)!important;box-shadow:0 0 0 2px rgba(0,0,0,.15),0 6px 18px rgba(0,0,0,.35)!important}#pmShot:active{transform:scale(.9)}
#pmTip{position:absolute;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:6;background:rgba(43,38,34,.82);color:#fff;font-size:12px;font-weight:700;border-radius:12px;padding:6px 12px;white-space:nowrap;display:none;pointer-events:none;transition:opacity .5s}
#sv.photomode #svTop,#sv.photomode #svCtl,#sv.photomode #woofBig,#sv.photomode #svBubble,#sv.photomode #svGuide,#sv.photomode #critter,#sv.photomode #critCard,#sv.photomode #bone,#sv.photomode .shade,#sv.photomode #gestTip{display:none!important}
#pmFrame{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}#sv.pm-guide #pmFrame,#sv.framed #pmFrame{display:block}#sv.framed #pmFrame{pointer-events:auto}
#pmFrame .win{position:absolute;left:var(--wx);top:var(--wy);width:var(--ws);height:var(--ws);box-shadow:0 0 0 3000px rgba(0,0,0,.42);outline:2px dashed rgba(255,255,255,.85);outline-offset:-2px}
#sv.framed #pmFrame .win{box-shadow:0 0 0 3000px #fbf8f1;outline:0}
#pmFrame .tint{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.10) 0,transparent 45%,rgba(40,20,0,.32) 100%),linear-gradient(rgba(255,170,90,.10),rgba(255,120,60,.10))}
#pmFrame .ccd{position:absolute;right:12px;bottom:10px;display:none;font:700 19px/1 "Courier New",monospace;letter-spacing:1px;color:#ff9a3c;text-shadow:0 0 3px #ff6a00,0 0 8px rgba(255,120,0,.7)}
#pmFrame .cap{position:absolute;left:var(--wx);width:var(--ws);top:calc(var(--wy) + var(--ws) + 22px);text-align:center;display:none;color:#3a332c}
#pmFrame .cap b{display:block;font-size:21px;font-weight:900;letter-spacing:1px}#pmFrame .cap small{display:block;margin-top:6px;font-size:12px;color:#9a8f82}
#sv.framed #pmFrame .cap,#sv.framed #pmFrame .tint,#sv.framed #pmFrame .ccd{display:block}
#sv.framed #pmBar,#sv.framed #pmTip{display:none!important}#sv.framed #svTeam img{outline:0!important}body.framed #toast{display:none!important}
#sv.photomode #svTeam{animation:none;bottom:calc(104px + var(--sab))}#sv.photomode #svTeam img{pointer-events:auto;animation:none!important}#sv.photomode #svTeam img.sel{outline:2px dashed rgba(255,255,255,.7);outline-offset:3px}body.shooting #toast{display:none!important}
#woofBig{position:absolute;left:10px;bottom:calc(10px + var(--sab));width:56px;height:56px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#ffd49a,#ff9a3c);box-shadow:0 6px 18px rgba(255,122,61,.45),inset 0 -4px 0 rgba(0,0,0,.08);
  font-size:26px;display:flex;align-items:center;justify-content:center;animation:wiggle 2.4s ease-in-out infinite;border:3px solid #fff}
#woofBig b{position:absolute;top:-10px;right:-14px;background:#fff;color:#ff7a3d;font-size:12px;font-weight:900;border-radius:10px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#woofBig:active{transform:scale(.88)}@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:950;display:none}#sv #fx2{position:absolute;inset:0;pointer-events:none;z-index:2;display:none}
.fx-rain{display:block!important;background:repeating-linear-gradient(105deg,rgba(220,235,255,.0) 0 14px,rgba(220,235,255,.35) 14px 15px,rgba(220,235,255,0) 15px 34px);background-size:120px 120px;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-30px 120px}}
.fx-snow{display:block!important;background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px);background-size:60px 60px,37px 37px;animation:snow 4s linear infinite}
@keyframes snow{to{background-position:20px 60px,-10px 37px}}
.fx-fog{display:block!important;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.15))}
.fx-night{display:block!important;background:rgba(15,25,70,.32);mix-blend-mode:multiply}
#vitals{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap}
#vitals i{display:inline-block;width:32px;height:5px;border-radius:3px;background:#f0e6d6;vertical-align:1px;overflow:hidden;position:relative}#vitals i b{position:absolute;inset:0;right:auto;border-radius:3px}
#stampFx{position:fixed;left:50%;top:40%;z-index:2900;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#stampFx.go{display:block;animation:stampin .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampin{0%{transform:translate(-50%,-50%) scale(3) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}}
.pp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}.pp div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);text-align:center}
.ach{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:13px}.ach b{flex:1}.ach.done{background:#fff4ec;border-color:#ffc9a8}
.ach i{display:block;height:5px;background:#f3ece0;border-radius:3px;overflow:hidden;margin-top:4px}.ach i u{display:block;height:100%;background:#ff7a3d}
.wardrobe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.wardrobe button{padding:10px 4px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:24px}.wardrobe button small{display:block;font-size:11px;color:var(--muted)}
.wardrobe button.on{border-color:var(--accent);background:#fff4ec}.wardrobe button:disabled{opacity:.35}
#bone{position:absolute;left:30%;bottom:calc(120px + var(--sab));font-size:64px;z-index:3;display:none;cursor:pointer;animation:bonejump .7s ease-in-out infinite alternate;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
@keyframes bonejump{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-18px) rotate(10deg)}}
#svRest{display:none}
#svNo{z-index:2}
#sv .shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
#svTeam{position:absolute;left:6px;right:6px;bottom:calc(74px + var(--sab));display:flex;justify-content:center;align-items:flex-end;pointer-events:none;gap:4px}
#svTeam img{height:min(22vh,170px);filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));transform-origin:bottom center;pointer-events:none;cursor:grab;touch-action:none;-webkit-user-drag:none;user-select:none}
#svTeam img.placed{position:fixed;animation:none!important;transform-origin:50% 100%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#svTeam img.dragging{cursor:grabbing;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4))}
#svTeam img.p{height:min(36vh,280px)}
#svTeam.moving img{animation:walk .42s ease-in-out infinite alternate}
#svTeam.moving img:nth-child(2n){animation-delay:.21s}

function greatCircle(a,b){const v=p=>[Math.cos(p.lat*D2R)*Math.cos(p.lng*D2R),Math.cos(p.lat*D2R)*Math.sin(p.lng*D2R),Math.sin(p.lat*D2R)];
  const A=v(a),B=v(b);const om=Math.acos(clamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2],-1,1))||1e-9;const pts=[];let pl=null;

function planTrip(dest,gm){const from={lat:S.pos.lat,lng:S.pos.lng},oR=REGIONS[S.region],dR=REGIONS[dest.r||S.region],legs=[],to={lat:dest.lat,lng:dest.lng};
  if(!dest.r||dest.r===S.region){legs.push({mode:gm,pts:line(from,to),label:'前往 '+dest.n});return legs;}
  if(oR.c!==dR.c||oR.c==='ZZ'){
    if(oR.c==='TW'){if(hav(from,TPE_AIRPORT)>2)legs.push({mode:'mrt',pts:line(from,TPE_AIRPORT),label:'搭機場捷運到桃園機場'});legs.push({mode:'plane',pts:greatCircle(TPE_AIRPORT,to),label:'桃園機場 → '+dR.n});}
    else legs.push({mode:'plane',pts:greatCircle(from,to),label:oR.n+' → '+dR.n});return legs;}
  if(oR.c==='TW'){const hO=hsrOf(oR),hD=hsrOf(dR);
    if(hO!=null&&hD!=null&&hO!==hD&&!oR.east&&!dR.east){const sO=HSR[hO],sD=HSR[hD],pO={lat:sO[1],lng:sO[2]},pD={lat:sD[1],lng:sD[2]};
      if(hav(from,pO)>.6)legs.push({mode:hav(from,pO)<1.5?'walk':'bus',pts:line(from,pO),label:'前往 高鐵'+sO[0]+'站'});
      const seq=hO<hD?HSR.slice(hO,hD+1):HSR.slice(hD,hO+1).reverse();legs.push({mode:'hsr',pts:seq.map(h=>({lat:h[1],lng:h[2]})),label:'高鐵 '+sO[0]+' → '+sD[0],stations:seq.map(h=>h[0])});

function prepLeg(l){let t=0;l.cum=[0];for(let i=1;i<l.pts.length;i++){t+=hav(l.pts[i-1],l.pts[i]);l.cum.push(t);}l.km=t;return l;}

async function startTrip(dest,gm){unlockSpeech();try{audioCtx();}catch(e){}closeSheet();if(!S.team.length){openTeam(true);return;}

    if(l.mode==='walk'||l.mode==='bike')await streetWalk(l);else await rideLeg(l);
    S.stats.km[l.mode]=(S.stats.km[l.mode]||0)+l.km;if(l.mode==='walk')energy(-l.km*12);else if(l.mode==='bike')energy(-l.km*5);const e=l.pts[l.pts.length-1];S.pos={lat:e.lat,lng:((e.lng+540)%360)-180};J.cur=null;meMk.setLatLng([S.pos.lat,S.pos.lng]);save();}
  const newR=dest.r&&dest.r!==S.region;if(dest.r)S.region=dest.r;

  S.journal.push({t:Date.now(),n:dest.n,r:S.region,to:{lat:S.pos.lat,lng:S.pos.lng}});if(S.journal.length>200)S.journal.shift();

  else toast('抵達 '+dest.n+' '+(dest.e||''));

function showStatus(l){const el=$('#status');el.style.display='block';el.textContent=MODES[l.mode].e+' '+l.label+' · '+fmtKm(l.km);}

/* 搭交通工具：衛星地圖上真實移動 */
async function rideLeg(l){if(l.mode==='bus'&&l.km<40){await roadRoute(l);if(trail)trail.setLatLngs(J.legs.flatMap(x=>x.pts.map(p=>[p.lat,p.lng])));}const was=useSat;setLayer(true);drawMe(true,l.mode);showRide(l);

  await new Promise(res=>{const step=t=>{const f=clamp((t-t0)/dur,0,1);const p=legAt(l,ease(f));J.cur=p;meMk.setLatLng([p.lat,p.lng]);
      if(l.km<60)map.panTo([p.lat,p.lng],{animate:false});
      if(f<1)requestAnimationFrame(step);else res();};requestAnimationFrame(step);});
  await Promise.race([ann,sleep(26000)]);await Promise.race([announce(l,'end'),sleep(14000)]);

/* 擺位：單指拖曳、兩指縮放＋旋轉（手指可以放在畫面任何地方，作用在選中的隊員）、點兩下左右翻面 */
const SG={pts:new Map(),sel:null,b:null,tap:0};

function sgApply(im){const t=im._t;const w=t.h*(im.naturalWidth||1)/(im.naturalHeight||1);im.style.height=t.h+'px';im.style.left=(t.cx-w/2)+'px';im.style.top=(t.by-t.h)+'px';im.style.transform=`rotate(${t.rot}deg) scaleX(${t.flip})`;}

/* 手機截圖流程：畫面上下各畫一條洋紅色線 → 使用者截圖 → 選取截圖 → 自動找到兩條線，只留下街景 */
/* 手機「眼前街景」：畫面上下各一條洋紅色定位線 → 截圖 → 點一下畫面就自動從剪貼簿貼上（iPhone 可設定「輕點背面兩下」一次完成截圖＋拷貝） */
let lastShotSig='';
function startShotMode(s,near,nd,wasHold){const imgs=[...$('#svTeam').querySelectorAll('img')];

  const end=()=>{sv.classList.remove('shooting');document.body.classList.remove('shooting');ui.onclick=null;clearTimeout(startShotMode.t);};
  const showHint=()=>{hint.innerHTML=S.shotSC?'輕點手機背面兩下拍下街景<br><small>拍好後點一下畫面</small>':'現在截圖<br><small>截好後點一下畫面</small>';hint.style.display='block';hint.style.opacity=1;clearTimeout(startShotMode.t);

  const finish=async blob=>{const im=await loadImg(URL.createObjectURL(blob));const r=await cropShot(im);end();closeSheet();openCam(where,{walk:true,shot:{img:r.img,pos},resume});};
  sv.classList.add('shooting');document.body.classList.add('shooting');ui.style.pointerEvents='auto';showHint();
  ui.onclick=async()=>{

    try{if(navigator.clipboard?.read){const items=await navigator.clipboard.read();for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(!t)continue;

async function cropShot(im){const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);
  const mag=y=>{let n=0;for(const fx of[.2,.5,.8]){const d=g.getImageData(Math.round(W*fx),y,1,1).data;if(d[0]>200&&d[1]<90&&d[2]>200)n++;}return n>=2;};
  let t=-1,b=-1;for(let y=0;y<H*.5;y++)if(mag(y)){t=y;while(t<H&&mag(t))t++;break;}for(let y=H-1;y>H*.5;y--)if(mag(y)){b=y;while(b>0&&mag(b))b--;break;}
  const ok=t>0&&b>t;let y0=0,y1=H;if(ok)y0=t+2,y1=b-1;else{const ch=Math.min(H,Math.round(W*innerHeight/innerWidth));y0=Math.round((H-ch)/2);y1=y0+ch;}
  const o=document.createElement('canvas');o.width=W;o.height=y1-y0;o.getContext('2d').drawImage(c,0,y0,W,y1-y0,0,0,W,y1-y0);return{ok,img:await loadImg(o.toDataURL('image/jpeg',.92))};}

/* ---------- Mapillary：找最近的照片（優先 360°），用 WebGL 畫出可以轉動的視角 ---------- */
async function mlyFind(p,heading){const f='id,thumb_2048_url,computed_compass_angle,compass_angle,camera_type,geometry,captured_at,is_pano';
  for(const r of[.0006,.0015,.003]){try{const u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(MAPILLARY_TOKEN)}&fields=${f}&limit=60&bbox=${p.lng-r},${p.lat-r},${p.lng+r},${p.lat+r}`;
      const j=await (await fetch(u)).json();const L=(j.data||[]).filter(x=>x.thumb_2048_url&&x.geometry);if(!L.length)continue;
      const sc=x=>{const[lo,la]=x.geometry.coordinates,d=hav(p,{lat:la,lng:lo})*1000;const pano=x.is_pano||/spherical|equirect/.test(x.camera_type||'');const a=x.computed_compass_angle??x.compass_angle??0;

      L.sort((a,b)=>sc(a)-sc(b));const x=L[0];x.pano=x.is_pano||/spherical|equirect/.test(x.camera_type||'');return x;}catch(e){}}
  return null;}
const MV={gl:null,prog:null,tex:null,yaw:0,pitch:0,fov:75,flat:{x:0,z:1}};
function mlyGL(){if(MV.gl)return MV.gl;const c=$('#mlyCv');const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});if(!gl)return null;
  const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o;};

  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision highp float;uniform sampler2D t;uniform vec2 res;uniform float yaw,pitch,fov;
    void main(){vec2 q=(gl_FragCoord.xy/res)*2.-1.;q.x*=res.x/res.y;float f=1./tan(fov*.5);vec3 d=normalize(vec3(q.x,q.y,-f));

(function(){const v=$('#mlyView');const P=new Map();let b=null;

let edit=null,busy=0,bgLib=null;
const TYPES=['狗','人','貓','其他'],TYPE_LABEL={'狗':'🐕 狗','人':'🧑 人','貓':'🐈 貓','其他':'🐾 其他'};
function openTeam(first){edit=edit||{name:S.teamName,list:S.team.map(m=>({...m})),first};const T=edit;

async function cutout(file,m,status){
  if(!bgLib){status('載入 AI 去背…');bgLib=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');}
  const small=await shrink(file,1600);
  const blob=await bgLib.removeBackground(small,{model:'isnet_fp16',output:{format:'image/png'},
    progress:(k,c,t)=>{if(k.startsWith('fetch'))status('下載 AI 模型 '+Math.round(100*c/(t||1))+'%');else status('AI 去背中…');}});
  status('裁切中…');m.orig=URL.createObjectURL(small);m.full=URL.createObjectURL(blob);return await trim(blob);}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function shrink(file,max){const im=await loadImg(URL.createObjectURL(file));const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.92));}
async function trim(blob){const im=await loadImg(URL.createObjectURL(blob));const w=im.naturalWidth,h=im.naturalHeight;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);
  const d=g.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<=x0)throw new Error('沒有找到主體');x0=Math.max(0,x0-4);y0=Math.max(0,y0-4);x1=Math.min(w,x1+4);y1=Math.min(h,y1+4);
  const cw=x1-x0,ch=y1-y0,s=Math.min(1,520/ch);const o=document.createElement('canvas');o.width=Math.round(cw*s);o.height=Math.round(ch*s);
  o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);
  const webp=o.toDataURL('image/webp',.9);return webp.startsWith('data:image/webp')?webp:o.toDataURL('image/png');}

  fit();

  const dab=(p)=>{const rad=size*p.k/ (zoom>1?1:1);

/* 找頭：人用「身體中軸」往上找（舉手、張開手都不會誤判），動物用最高點相連的區塊 */
async function headGeom(src,type){const im=await loadImg(src);const sc=Math.min(1,300/im.naturalHeight),w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);const d=g.getImageData(0,0,w,h).data;const A=(x,y)=>d[(y*w+x)*4+3]>90;
  let ty=-1,by=-1,tx=0;o1:for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(A(x,y)){ty=y;tx=x;break o1;}
  if(ty<0)return null;o2:for(let y=h-1;y>=0;y--)for(let x=0;x<w;x++)if(A(x,y)){by=y;break o2;}
  const H=Math.max(4,by-ty+1);let x0,x1,top,bot;
  if(type==='人'){const xs=[];for(let y=ty+Math.round(H*.24);y<ty+H*.5;y+=2)for(let x=0;x<w;x++)if(A(x,y))xs.push(x);xs.sort((a,b)=>a-b);let cx=xs.length?xs[xs.length>>1]:w/2;
    const hs=H*.16,xa=Math.max(0,Math.round(cx-hs*.55)),xb=Math.min(w-1,Math.round(cx+hs*.55));let hy=-1;
    // 頭頂：視窗內「夠寬」的第一列（舉起的手臂很細，會被略過），再往上補一點頭髮
    for(let y=ty;y<by&&hy<0;y++){let n=0;for(let x=xa;x<=xb;x++)if(A(x,y))n++;if(n>=hs*.4)hy=y;}
    if(hy<0)hy=ty;else{let y=hy;while(y>ty&&hy-y<hs*.12){let n=0;for(let x=xa;x<=xb;x++)if(A(x,y-1))n++;if(n<2)break;y--;}hy=y;}let sx=0,n=0;for(let y=hy;y<Math.min(by,hy+hs*.8);y++)for(let x=Math.max(0,Math.round(cx-hs*.7));x<=Math.min(w-1,Math.round(cx+hs*.7));x++)if(A(x,y)){sx+=x;n++;}if(n)cx=sx/n;
    x0=cx-hs*.5;x1=cx+hs*.5;top=hy;bot=hy+hs;}
  else{const band=Math.round(H*.33),lim=band*.9;const seen=new Uint8Array(w*h),q=[tx+ty*w];seen[q[0]]=1;let a0=tx,a1=tx,y1=ty;
    while(q.length){const i=q.pop(),x=i%w,y=(i/w)|0;if(x<a0)a0=x;if(x>a1)a1=x;if(y>y1)y1=y;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<ty||nx>=w||ny>ty+band||Math.abs(nx-tx)>lim)continue;const j=nx+ny*w;if(!seen[j]&&A(nx,ny)){seen[j]=1;q.push(j);}}}
    if(a1-a0>band*1.4){const m=(a0+a1)/2;a0=m-band*.7;a1=m+band*.7;}x0=a0;x1=a1;top=ty;bot=Math.min(y1,ty+band);}
  return{im,x0:x0/sc,x1:x1/sc,top:top/sc,bot:bot/sc};}

function wearPos(emo,b){const hw=b.x1-b.x0,hh=b.bot-b.top,cx=(b.x0+b.x1)/2;

  let pg=null;try{const j=await (await fetch(`https://zh.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&variant=zh-tw&prop=extracts|pageimages|pageprops|coordinates&explaintext=1&exsectionformat=wiki&piprop=thumbnail&pithumbsize=900&ppprop=wikibase_item&titles=${encodeURIComponent(title)}`,{headers:{'Accept-Language':'zh-TW'}})).json();

function bark(pitch=1){if(!sndOn())return;let ac;try{ac=audioCtx();}catch(e){return;}const n=1+(Math.random()<.6?1:0);
  for(let k=0;k<n;k++){const t0=ac.currentTime+.02+k*(.2+Math.random()*.05),p=pitch*(.92+Math.random()*.16);
    const o=ac.createOscillator(),e=gainN(ac,0),f=filt(ac,'bandpass',950*p,1.4),sh=ac.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*3);}sh.curve=c;
    o.type='sawtooth';o.frequency.setValueAtTime(520*p,t0);o.frequency.exponentialRampToValueAtTime(820*p,t0+.03);o.frequency.exponentialRampToValueAtTime(330*p,t0+.14);
    e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(.55,t0+.012);e.gain.exponentialRampToValueAtTime(.001,t0+.17);o.connect(sh).connect(f).connect(e).connect(ac.destination);o.start(t0);o.stop(t0+.2);
    const nz=noise(ac,'white'),nf=filt(ac,'bandpass',1800*p,1),ne=gainN(ac,0);ne.gain.setValueAtTime(0,t0);ne.gain.linearRampToValueAtTime(.18,t0+.008);ne.gain.exponentialRampToValueAtTime(.001,t0+.07);nz.connect(nf).connect(ne).connect(ac.destination);nz.stop(t0+.1);}}

  toast('取得你的位置中…');
  navigator.geolocation.getCurrentPosition(pos=>{const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    const near=Object.values(REGIONS).filter(r=>r.k!=='home').map(r=>({r,d:hav(p,r.center)})).sort((a,b)=>a.d-b.d)[0];
    if(near.d<45){S.region=near.r.k;}else{S.home=p;REGIONS.home=mkHome(p);S.region='home';}
    S.pos=p;save();drawMe();meMk.setLatLng([p.lat,p.lng]);map.flyTo([p.lat,p.lng],16,{duration:1});updateHere();pushPresence();toast('📍 從你現在的位置出發！');},
   ()=>{if(force)toast('沒辦法取得定位，請到設定允許定位');else toast('沒有定位，先從台北車站出發');},{enableHighAccuracy:true,timeout:10000});}

/* ================= 朋友同時上線（選用 Firebase） ================= */
let db=null,others={},meetResume=null;const markers={};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function thumbOf(src){if(!src)return '';const im=await loadImg(src);const s=110/im.naturalHeight;const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=110;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const w=c.toDataURL('image/webp',.8);return w.startsWith('data:image/webp')?w:c.toDataURL('image/png');}
async function pushPresence(full){if(!db)return;const p=curPos();const ref=db.ref('walkers/'+S.uid);
  const data={n:(S.teamName||'').slice(0,16),r:S.region,lat:+p.lat.toFixed(5),lng:+(((p.lng+540)%360)-180).toFixed(5),m:J?.leg?.mode||'',ts:firebase.database.ServerValue.TIMESTAMP};
  if(full||!pushPresence.sent){data.t=[];for(const m of S.team.slice(0,3))data.t.push({i:await thumbOf(m.img),p:m.type==='人'?1:0});pushPresence.sent=1;ref.set(data);}else ref.update(data);}
async function initFirebase(){if(!FIREBASE)return;try{
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  firebase.initializeApp(FIREBASE);db=firebase.database();
  db.ref('.info/connected').on('value',s=>{const on=!!s.val();$('#online').classList.toggle('on',on);if(on){db.ref('walkers/'+S.uid).onDisconnect().remove();pushPresence(true);}});
  db.ref('walkers').on('value',s=>{others=s.val()||{};delete others[S.uid];const now=Date.now();
    for(const k in others)if(!others[k]||now-(others[k].ts||0)>120000)delete others[k];
    $('#online span').textContent='線上 '+(Object.keys(others).length+1)+' 隊';renderOthers();});
  db.ref('woofs/'+S.uid).on('child_added',s=>{const v=s.val()||{};const from=String(v.from||'有人').slice(0,16);
    toast({woof:'🐶 '+from+' 對你們汪了一聲！',hi:'👋 '+from+' 對你們揮揮手',heart:'💛 '+from+' 送你們一顆愛心'}[v.a]||'🐶 '+from+' 跟你們打招呼');s.ref.remove();});
  setInterval(()=>pushPresence(false),3000);
 }catch(e){console.warn(e);toast('多人連線設定有問題，先用單人模式');}}
function othersTeam(o){return(Array.isArray(o.t)?o.t:[]).filter(x=>x&&typeof x.i==='string'&&x.i.startsWith('data:image/')).map(x=>({img:x.i,type:x.p?'人':'狗'}));}
function renderOthers(){for(const k in markers)if(!others[k]){map.removeLayer(markers[k]);delete markers[k];}
  for(const[k,o]of Object.entries(others)){if(typeof o.lat!=='number'||typeof o.lng!=='number')continue;
    const html=teamHTML(othersTeam(o),String(o.n||'朋友').slice(0,16)+' · 真人',!!o.m,MODES[o.m]?o.m:'');
    const icon=L.divIcon({className:'',html:`<div style="transform:translate(-50%,-100%);opacity:.95">${html}</div>`,iconSize:[0,0]});
    if(!markers[k]){markers[k]=L.marker([o.lat,o.lng],{icon}).addTo(map);markers[k].on('click',()=>openMeet(k,null));}else{markers[k].setLatLng([o.lat,o.lng]);markers[k].setIcon(icon);}}}
function checkMeet(p){if(!db||!J)return false;for(const[k,o]of Object.entries(others)){if(J.met.has(k)||typeof o.lat!=='number')continue;
    if(hav(p,{lat:o.lat,lng:o.lng})<.15){J.met.add(k);SVs.paused=true;openMeet(k,()=>{if(SVs){SVs.paused=false;svNext();}});return true;}}return false;}
function openMeet(k,resume){const o=others[k];if(!o)return;const nm=String(o.n||'朋友').slice(0,16);const t=othersTeam(o);meetResume=resume;
  openSheet(`<div class="meet">${t[0]?`<img src="${t[0].img}" alt="">`:'<div style="font-size:70px">🐕</div>'}<h2>${resume?'路上遇到 ':''}${esc(nm)}</h2><p class="sub">他們也正在遛狗</p>
  <div class="acts"><button data-a="woof"><span>🐶</span>汪一聲</button><button data-a="hi"><span>👋</span>揮揮手</button><button data-a="heart"><span>💛</span>送愛心</button></div><button class="ghost" id="bye">${resume?'繼續走':'掰掰'}</button></div>`,true);
  const done=()=>{closeSheet();const f=meetResume;meetResume=null;f&&f();};
  $('#sheet').querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{db.ref('woofs/'+k).push({a:b.dataset.a,from:(S.teamName||'').slice(0,16)});
    S.stats.met[k]={n:nm};save();toast('已經送給 '+nm);done();});$('#bye').onclick=done;}

/* ================= 開始 ================= */
function updateHere(){const r=REGIONS[S.region]||REGIONS.taipei;let near=null,nd=1e9;for(const s of SPOTS){const d=hav(S.pos,s);if(d<nd){nd=d;near=s;}}
  $('#teamName').textContent=S.teamName||'雲端遛狗';$('#here').textContent='📍 '+r.n+(COUNTRY[r.c]&&r.c!=='TW'?'（'+COUNTRY[r.c]+'）':'')+(near&&nd<3?' · '+(nd<.25?near.n:near.n+'附近'):'');
  $('#av').innerHTML=S.team[0]?`<img src="${S.team[0].img}" alt="">`:'🐕';if(window.checkSnapRef)checkSnapRef(false);}
drawMe();updateHere();syncLabels();initFirebase();vitals();updateWeather(S.pos,false);checkAch();if(!FIREBASE)$('#online').style.display='none';setTimeout(()=>checkSnap(false),800);
if(!S.team.length)setTimeout(()=>openTeam(true),400);
</script>
</body>
