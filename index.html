<style>

async function fetchPlanes(c,nm){const j=await (await fetch(`https://api.adsb.lol/v2/point/${c.lat.toFixed(3)}/${c.lng.toFixed(3)}/${Math.round(nm)}`)).json();return(j.ac||[]).filter(a=>typeof a.lat==='number'&&typeof a.lon==='number'&&(+a.alt_baro||+a.alt_geom||0)>300);}
async function refreshPlanes(){if(planeBusy||document.hidden)return;const z=map.getZoom();if(z<7||J?.leg?.mode==='walk'&&$('#sv').style.display==='block'){PLANES.clearLayers();return;}
  planeBusy=true;try{const c=map.getCenter(),b=map.getBounds();const nm=Math.min(250,Math.max(10,hav({lat:c.lat,lng:c.lng},{lat:b.getNorth(),lng:b.getEast()})/1.852));
    const ac=(await fetchPlanes({lat:c.lat,lng:c.lng},nm)).slice(0,60);PLANES.clearLayers();
    for(const a of ac){const ft=+(a.alt_geom||a.alt_baro)||0,tr=+a.track||0,cs=(a.flight||'').trim();
      const m=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:`<div class="planemk" style="transform:rotate(${tr-45}deg)">✈️</div>`,iconSize:[22,22],iconAnchor:[11,11]}),interactive:true,keyboard:false});
      m.bindPopup(`✈️ <b>${esc(cs||'飛機')}</b><br>高度約 ${(ft*.3048/1000).toFixed(1)} 公里${a.gs?` · 時速約 ${Math.round(a.gs*1.852)} 公里`:''}<br><small style="opacity:.7">即時航班資料：adsb.lol</small>`);m.addTo(PLANES);}
    if(ac.length&&!S.planeTip){S.planeTip=1;save();toast('✈️ 地圖上的小飛機是現在真的在天上飛的飛機，點一下看看',4200);}}catch(e){}planeBusy=false;}
const PLANES_ON=false;/* 免費的即時航班資料都不允許網頁直接讀取（CORS），先關閉 */

let J=null,trail=null;
function curPos(){return J&&J.cur?J.cur:S.pos;}
function groundOptions(km){return{walk:km<=4,bike:km<=20,bus:km>=.3,rec:km<=1.5?'walk':km<=6?'bike':'bus'};}
function hsrOf(r){return r.hsr!=null?r.hsr:(r.via?REGIONS[r.via].hsr:null);}
function line(a,b,n=12){const pts=[];for(let i=0;i<=n;i++)pts.push({lat:lerp(a.lat,b.lat,i/n),lng:lerp(a.lng,b.lng,i/n)});return pts;}
function greatCircle(a,b){const v=p=>[Math.cos(p.lat*D2R)*Math.cos(p.lng*D2R),Math.cos(p.lat*D2R)*Math.sin(p.lng*D2R),Math.sin(p.lat*D2R)];
  const A=v(a),B=v(b);const om=Math.acos(clamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2],-1,1))||1e-9;const pts=[];let pl=null;
  for(let i=0;i<=64;i++){const t=i/64,s1=Math.sin((1-t)*om)/Math.sin(om),s2=Math.sin(t*om)/Math.sin(om);const x=s1*A[0]+s2*B[0],y=s1*A[1]+s2*B[1],z=s1*A[2]+s2*B[2];
    let lng=Math.atan2(y,x)/D2R;const lat=Math.atan2(z,Math.hypot(x,y))/D2R;if(pl!==null){while(lng-pl>180)lng-=360;while(lng-pl<-180)lng+=360;}pl=lng;pts.push({lat,lng});}return pts;}
const AIR_NAME={newtaipei:'桃園',banff:'卡加利',fuji:'東京',interlaken:'蘇黎世',highlands:'因弗尼斯',stonehenge:'倫敦',cappadocia:'開塞利',machupicchu:'庫斯科',agra:'新德里',hanoi:'河內',grandcanyon:'弗拉格斯塔夫',lasvegas:'拉斯維加斯',quebec:'魁北克',venice:'威尼斯',bali:'峇里島',jeju:'濟州',okinawa:'那霸',sapporo:'札幌'};
const TPE_STATION={lat:25.0478,lng:121.5170};
/* 這一段交通在哪個國家（從國外飛回台灣後，接下來的車是台灣的，不是出發地的） */
function regionAt(p){let best=null,bd=1e9;for(const r of Object.values(REGIONS)){if(!r.center||r.k==='home')continue;const d=hav(p,r.center);if(d<bd){bd=d;best=r;}}return best;}
function legCC(l){if(l.mode==='plane')return REGIONS[S.region]?.c||'TW';const p=l.pts?.[0];if(!p)return REGIONS[S.region]?.c||'TW';if(inTaiwanWide(p))return'TW';return regionAt(p)?.c||REGIONS[S.region]?.c||'TW';}
function legRegion(l){const p=l.pts?.[0];return(l.mode!=='plane'&&p&&regionAt(p))||REGIONS[S.region]||{};}
const inTaiwanWide=p=>(p.lat>21.8&&p.lat<25.4&&p.lng>119.9&&p.lng<122.1)||(hav(p,{lat:23.57,lng:119.58})<40)||(hav(p,{lat:24.44,lng:118.35})<25);
/* 機場：自訂地點（地址搜尋）用最近的已知城市機場 */
function airOf(rk,p){const r=REGIONS[rk];if(r&&R_IATA[rk])return{code:R_IATA[rk],name:AIR_NAME[rk]||r.n};const n=p&&regionAt(p);if(n&&R_IATA[n.k]&&hav(p,n.center)<400)return{code:R_IATA[n.k],name:AIR_NAME[n.k]||n.n};return{code:'',name:r?.n||'目的地'};}
function planTrip(dest,gm,o){const from=o?.from||{lat:S.pos.lat,lng:S.pos.lng},oRk=o?.r||S.region,oR=REGIONS[oRk],dR=REGIONS[dest.r||oRk],legs=[],to={lat:dest.lat,lng:dest.lng};const fA=airOf(oRk,from),tA=airOf(dest.r||oRk,to);
  if(!dest.r||dest.r===oRk){if(o&&hav(from,to)>3){legs.push({mode:'bus',pts:line(from,to),label:'前往 '+dest.n});return legs;}legs.push({mode:gm,pts:line(from,to),label:'前往 '+dest.n});return legs;}
  if((oR.c==='HK'&&dR.c==='MO')||(oR.c==='MO'&&dR.c==='HK')){legs.push({mode:'bus',pts:line(from,to),label:'跨海大橋巴士 '+oR.n+' → '+dR.n});return legs;}
  if(oR.c!==dR.c||oR.c==='ZZ'){
    const toAir=AIR_NAME[dR.k]||dR.n;
    if(dR.c==='TW'&&!dR.isl){/* 回台灣：先飛到桃園機場，再搭捷運、高鐵或客運到目的地 */
      legs.push({mode:'plane',pts:greatCircle(from,TPE_AIRPORT),label:fA.name+' → 桃園機場',toName:'桃園',fromName:fA.name,fromCode:fA.code,toCode:'TPE'});
      if(dest.r==='taipei'||dest.r==='newtaipei'||hsrOf(dR)!=null||dR.via||dR.east){legs.push({mode:'mrt',pts:line(TPE_AIRPORT,TPE_STATION),label:'搭機場捷運到台北車站',airport:'in'});legs.push(...planTrip(dest,gm,{from:TPE_STATION,r:'taipei'}));}
      else legs.push(...planTrip(dest,gm,{from:TPE_AIRPORT,r:'taipei'}));return legs;}
    if(oR.c==='TW'){if(hav(from,TPE_AIRPORT)>2)legs.push({mode:'mrt',pts:line(from,TPE_AIRPORT),label:'搭機場捷運到桃園機場'});legs.push({mode:'plane',pts:greatCircle(TPE_AIRPORT,to),label:'桃園機場 → '+tA.name,toName:tA.name,fromName:'桃園',fromCode:'TPE',toCode:tA.code});}
    else legs.push({mode:'plane',pts:greatCircle(from,to),label:fA.name+' → '+tA.name,toName:tA.name,fromName:fA.name,fromCode:fA.code,toCode:tA.code});return legs;}
  if(oR.isl||dR.isl||(oR.c!=='TW'&&hav(from,to)>450)){legs.push({mode:'plane',pts:greatCircle(from,to),label:fA.name+' → '+tA.name,toName:tA.name,fromName:fA.name,fromCode:fA.code,toCode:tA.code});return legs;}
  if(oR.c==='TW'){const hO=hsrOf(oR),hD=hsrOf(dR);
    if(hO!=null&&hD!=null&&hO!==hD&&!oR.east&&!dR.east){const sO=HSR[hO],sD=HSR[hD],pO={lat:sO[1],lng:sO[2]},pD={lat:sD[1],lng:sD[2]};
      if(hav(from,pO)>.6)legs.push({mode:hav(from,pO)<1.5?'walk':'bus',pts:line(from,pO),label:'前往 高鐵'+sO[0]+'站'});
      const seq=hO<hD?HSR.slice(hO,hD+1):HSR.slice(hD,hO+1).reverse();legs.push({mode:'hsr',pts:seq.map(h=>({lat:h[1],lng:h[2]})),label:'高鐵 '+sO[0]+' → '+sD[0],stations:seq.map(h=>h[0])});
      if(hav(pD,to)>.6)legs.push({mode:hav(pD,to)<1.5?'walk':'bus',pts:line(pD,to),label:dR.via?'轉客運到 '+dR.n:'前往 '+dest.n});return legs;}
    if(oR.east||dR.east){legs.push({mode:'tra',pts:line(from,to),label:'台鐵 '+oR.n+' → '+dR.n});return legs;}

  if(oR.c==='JP'){const far=hav(from,to)>250;if(far){const viaN=(oR.k==='tokyo'||dR.k==='tokyo')&&hav(from,to)>300;legs.push({mode:'shinkansen',pts:viaN?[from,NAGOYA,to]:[from,to],label:'新幹線 '+oR.n+' → '+dR.n});}else legs.push({mode:'train',pts:line(from,to),label:'電車 '+oR.n+' → '+dR.n});return legs;}

function prepLeg(l){let t=0;l.cum=[0];for(let i=1;i<l.pts.length;i++){t+=hav(l.pts[i-1],l.pts[i]);l.cum.push(t);}l.km=t;return l;}

  if(newR){setTimeout(arrivalCard,400);const r=REGIONS[S.region];if(!S.stats.cities.includes(S.region)){S.stats.cities.push(S.region);toast('🎉 第一次來到 '+r.n+'！');mood(8);setTimeout(()=>addStamp('city:'+S.region,r.n,(TH(r.c).e||['🐾'])[0],r.c),900);}else toast('抵達 '+r.n+' · '+dest.n);}

  map.flyTo([S.pos.lat,S.pos.lng],16,{duration:1.2});updateHere();save();pushPresence();checkSnap(true);{const eg=EGGS.find(x=>hav(S.pos,x)<x.r);if(eg&&!S.eggs?.[eg.id])setTimeout(()=>{if(!J)checkEgg(S.pos);},3500);}updateWeather(S.pos,newR);checkAch();}

/* 射氣球：10 支飛鏢，點氣球射破 */
function balloonGame(again){markFirst('game');const G=gameOpen('🎈 射氣球','飛鏢 8');const{c,x,W,H}=G;const cols=5,rows=4,bw=Math.min(64,W/6.2),gapX=(W-cols*bw)/(cols+1),top=40;
  const hues=[0,30,50,120,200,280,320];const B=[];for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)B.push({x:gapX+bw/2+k*(bw+gapX),y:top+bw*.7+r*bw*1.45,h:hues[(r*cols+k)%hues.length],ph:Math.random()*6,alive:true});
  let darts=8,score=0,fly=null,parts=[];const spd=[0,0,0,0].map((_,r)=>(r%2?-1:1)*(W*.12+r*W*.05));$('#gInfo').textContent='飛鏢 '+darts+' · 射破 0';
  const board=()=>{x.fillStyle='#3b2a20';x.fillRect(0,0,W,H);x.fillStyle='#f6e7c8';x.fillRect(10,10,W-20,top+rows*bw*1.45+bw*.4);
    for(let i=0;i<14;i++){x.fillStyle=i%2?'#d9462a':'#fff';x.fillRect(10+i*(W-20)/14,10,(W-20)/14,14);}};
  const span=cols*(bw+gapX);const tick=t=>{board();for(const b of B){if(!b.alive)continue;const r=Math.round((b.y-top-bw*.7)/(bw*1.45));b.x=((b.x0??=b.x)-gapX+spd[r]*t/1000%span+span*9)%span+gapX*.5;const yy=b.y+Math.sin(t/400+b.ph)*7;const g=x.createRadialGradient(b.x-bw*.15,yy-bw*.2,2,b.x,yy,bw*.5);g.addColorStop(0,`hsl(${b.h},90%,80%)`);g.addColorStop(1,`hsl(${b.h},80%,50%)`);
      x.fillStyle=g;x.beginPath();x.ellipse(b.x,yy,bw*.38,bw*.46,0,0,7);x.fill();x.strokeStyle='rgba(0,0,0,.25)';x.beginPath();x.moveTo(b.x,yy+bw*.46);x.lineTo(b.x+3,yy+bw*.75);x.stroke();b.cy=yy;}
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;x.fillStyle=p.c;x.fillRect(p.x,p.y,4,4);}parts=parts.filter(p=>p.l>0);
    if(fly){const k=Math.min(1,(t-fly.t0)/180),px=W/2+(fly.x-W/2)*k,py=H-30+(fly.y-H+30)*k;x.save();x.translate(px,py);x.rotate(Math.atan2(fly.y-H+30,fly.x-W/2)+Math.PI/2);x.fillStyle='#555';x.fillRect(-2,-14,4,22);x.fillStyle='#e94';x.beginPath();x.moveTo(0,10);x.lineTo(-6,18);x.lineTo(6,18);x.fill();x.restore();
      if(k>=1){const hit=B.find(b=>b.alive&&Math.hypot(b.x-fly.x,b.cy-fly.y)<bw*.36);if(hit){hit.alive=false;score++;popSnd();for(let i=0;i<14;i++)parts.push({x:hit.x,y:hit.cy,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*6,l:30,c:`hsl(${hit.h},80%,60%)`});}
        fly=null;$('#gInfo').textContent='飛鏢 '+darts+' · 射破 '+score;if(!darts)setTimeout(()=>winPrizes(score>=7?[PRIZES.l[Math.random()*5|0]]:score>=5?[PRIZES.m[Math.random()*5|0]]:score>=3?[PRIZES.s[Math.random()*5|0]]:[],score>=7?'神射手！大獎！':'射破 '+score+' 顆，拿到獎品！').querySelector('#gAgain').onclick=()=>balloonGame(true),500);}}
    x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(darts?'氣球會移動，抓準時機點下去 🎯':'',W/2,H-8);gameClose.raf=requestAnimationFrame(tick);};
  c.onpointerdown=e=>{if(fly||!darts)return;const r=c.getBoundingClientRect();darts--;fly={x:e.clientX-r.left,y:e.clientY-r.top,t0:performance.now()};};gameClose.raf=requestAnimationFrame(tick);}
/* 套圈圈：5 個圈，往上滑丟出去，套中的獎品帶回家 */
function ringGame(){markFirst('game');const G=gameOpen('⭕ 套圈圈','圈圈 5');const{c,x,W,H}=G;const rowsY=[.26,.4,.56],items=[];
  rowsY.forEach((ry,ri)=>{const n=4,sc=.6+ri*.22;for(let k=0;k<n;k++){const pool=ri===0?PRIZES.l:ri===1?PRIZES.m:PRIZES.s;items.push({x:W*(.14+k*.24)+(ri%2?W*.04:0),y:H*ry,s:44*sc,e:pool[(k+ri)%5],won:false});}});
  let rings=5,won=[],ring=null,drag=null;const ringAim=d=>{const dy=d.sy-d.y,dx=d.x-d.sx,pw=Math.min(1.25,dy/(H*.42));const ty=clamp(H-60-pw*(H*.62),H*.18,H*.64);return[clamp(W/2+dx/Math.max(dy,1)*(H-60-ty),10,W-10),ty];};
  const tick=t=>{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1d4a');g.addColorStop(1,'#5a3b2a');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.fillStyle='#8a6a48';x.beginPath();x.moveTo(W*.04,H*.66);x.lineTo(W*.96,H*.66);x.lineTo(W*.82,H*.16);x.lineTo(W*.18,H*.16);x.closePath();x.fill();
    for(let i=0;i<8;i++){x.fillStyle=`hsla(${i*45},90%,65%,.9)`;x.beginPath();x.arc(W*(.08+i*.12),18,6,0,7);x.fill();}
    x.textAlign='center';x.textBaseline='middle';for(const it of items){if(it.won)continue;x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(it.x,it.y+it.s*.42,it.s*.45,it.s*.14,0,0,7);x.fill();x.font=`${it.s}px serif`;x.fillText(it.e,it.x,it.y);}
    if(ring){const k=Math.min(1,(t-ring.t0)/650),px=ring.sx+(ring.tx-ring.sx)*k,py=ring.sy+(ring.ty-ring.sy)*k-Math.sin(k*Math.PI)*120,sc=1-.45*k*(1-(ring.ty/H));
      x.strokeStyle='#ffd23f';x.lineWidth=6*sc;x.beginPath();x.ellipse(px,py,26*sc,10*sc,0,0,7);x.stroke();
      if(k>=1){const hit=items.find(it=>!it.won&&Math.hypot(it.x-ring.tx,(it.y-ring.ty)*1.3)<it.s*.8);if(hit){hit.won=true;won.push(hit.e);chimeTick();for(let i=0;i<5;i++)setTimeout(()=>hearts(hit.x,hit.y+56,1,'✨'),i*90);}else popSnd();
        ring=null;$('#gInfo').textContent='圈圈 '+rings+' · 套中 '+won.length;if(!rings)setTimeout(()=>winPrizes(won,'套中了！帶回家～').querySelector('#gAgain').onclick=ringGame,600);}}
    else if(rings){const bx=W/2,by=H-60;x.strokeStyle='#ffd23f';x.lineWidth=6;x.beginPath();x.ellipse(drag?drag.x:bx,drag?drag.y:by,26,10,0,0,7);x.stroke();x.fillStyle='#fff';x.font='bold 13px sans-serif';x.fillText('按住往上滑，虛線圈是落點，放開就丟',W/2,H-18);if(drag&&drag.sy-drag.y>=25){const[ax,ay]=ringAim(drag);x.setLineDash([5,5]);x.strokeStyle='rgba(255,210,63,.8)';x.lineWidth=2;x.beginPath();x.ellipse(ax,ay,22,8,0,0,7);x.stroke();x.setLineDash([]);}}
    gameClose.raf=requestAnimationFrame(tick);};
  c.onpointerdown=e=>{if(ring||!rings)return;const r=c.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now(),sx:e.clientX-r.left,sy:e.clientY-r.top};};
  c.onpointermove=e=>{if(!drag)return;const r=c.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;};
  c.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;const dy=d.sy-d.y,dx=d.x-d.sx;if(dy<25)return;rings--;const pw=Math.min(1.25,dy/(H*.42));
    let[tx,ty]=ringAim(d);tx+=(Math.random()-.5)*8;ty+=(Math.random()-.5)*6;ring={sx:W/2,sy:H-60,tx,ty,t0:performance.now()};};
  gameClose.raf=requestAnimationFrame(tick);}

const blobToURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function packVal(v){if(v instanceof Blob)return{__blob:await blobToURL(v)};if(Array.isArray(v))return Promise.all(v.map(packVal));if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=await packVal(v[k]);return o;}return v;}
async function unpackVal(v){if(v&&typeof v==='object'&&v.__blob)return await (await fetch(v.__blob)).blob();if(Array.isArray(v))return Promise.all(v.map(unpackVal));if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=await unpackVal(v[k]);return o;}return v;}
const idbAll=(db,store)=>new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=rej;});

  if(emo==='⭐')return{x:b.x1-hw*.05,y:b.top+hw*.02,sz:hw*.4};
  if(emo==='🧣')return{x:cx,y:b.bot+hw*.05,sz:hw*.9};
  return{x:cx,y:b.top-hw*.1,sz:hw*1.02};}

let WEATHER=null;const WCACHE={};
function wmo(c){if(c===0)return['☀️','晴','clear'];if(c<=3)return['⛅','多雲','cloud'];if(c===45||c===48)return['🌫️','起霧','fog'];if(c>=51&&c<=67||c>=80&&c<=82)return['🌧️','下雨','rain'];if(c>=71&&c<=77||c===85||c===86)return['❄️','下雪','snow'];if(c>=95)return['⛈️','雷雨','rain'];return['🌤️','','cloud'];}
async function updateWeather(p,announce){const key=Math.round(p.lat*4)+','+Math.round(p.lng*4);const now=Date.now();let w=WCACHE[key];
  if(!w||now-w.at>15*60000){try{const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat.toFixed(3)}&longitude=${p.lng.toFixed(3)}&current=temperature_2m,weather_code,is_day&timezone=auto`)).json();
      const[icon,txt,kind]=wmo(j.current.weather_code);w={at:now,temp:j.current.temperature_2m,day:!!j.current.is_day,icon,txt,kind,off:j.utc_offset_seconds||0};WCACHE[key]=w;}catch(e){return;}}
  WEATHER=w;vitals();applyFx();
  if(announce){const lt=new Date(Date.now()+w.off*1000);const hh=lt.getUTCHours(),mm=String(lt.getUTCMinutes()).padStart(2,'0');
    toast(`${w.icon} 當地現在 ${hh}:${mm}，${w.txt||''} ${Math.round(w.temp)}°C${w.kind==='rain'?'，幫狗狗穿上雨衣 ☔':w.kind==='snow'?'，好冷！狗狗圍上圍巾 🧣':!w.day?'，晚上散步要注意安全 🌙':''}`,3800);}}
/* 雨：三層遠近的短雨絲，越近越長、越快、越不透明 */
const RAIN=new Map();
function rainOn(el){if(RAIN.has(el))return;const c=document.createElement('canvas');el.appendChild(c);const g=c.getContext('2d');let drops=[],W=0,H=0,last=performance.now();
  const reset=()=>{const dpr=Math.min(2,devicePixelRatio||1);W=el.clientWidth||innerWidth;H=el.clientHeight||innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5200);drops=Array.from({length:n},()=>{const z=Math.random();return{x:Math.random()*W,y:Math.random()*H,z,len:6+z*16,sp:520+z*780,a:.12+z*.38,w:.6+z*.9};});};
  reset();const st={c,raf:0,reset};
  const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(!el.isConnected||!el.classList.contains('fx-rain')){rainOff(el);return;}
    if(el.offsetParent!==null||getComputedStyle(el).position==='fixed'){if((el.clientWidth||innerWidth)!==W||(el.clientHeight||innerHeight)!==H)reset();g.clearRect(0,0,W,H);g.lineCap='round';
      for(const d of drops){d.y+=d.sp*dt;d.x-=d.sp*dt*.18;if(d.y>H+20){d.y=-20-Math.random()*40;d.x=Math.random()*(W+60);}if(d.x<-20)d.x+=W+40;
        g.strokeStyle=`rgba(225,235,250,${d.a})`;g.lineWidth=d.w;g.beginPath();g.moveTo(d.x,d.y);g.lineTo(d.x+d.len*.18,d.y-d.len);g.stroke();}}
    st.raf=requestAnimationFrame(tick);};
  st.raf=requestAnimationFrame(tick);RAIN.set(el,st);}
function rainOff(el){const st=RAIN.get(el);if(!st)return;cancelAnimationFrame(st.raf);st.c.remove();RAIN.delete(el);}
function applyFx(){const w=WEATHER;for(const el of[$('#fx'),$('#fx2')]){if(!el)continue;el.className='';if(!w){rainOff(el);continue;}const cls=w.kind==='rain'?'fx-rain':w.kind==='snow'?'fx-snow':w.kind==='fog'?'fx-fog':'';
    if(cls)el.classList.add(cls);if(cls==='fx-rain')rainOn(el);else rainOff(el);if(!w.day&&!cls)el.classList.add('fx-night');}

  await db.ref('parties/'+PARTY.pid+'/leader').set(rest[0]).catch(()=>toast('換人失敗，再試一次'));}
function partyUI(){const el=$('#party');if(!PARTY||!PARTY.leader){el.style.display='none';return;}const names=Object.entries(PARTY.members).filter(([u])=>u!==MYUID).map(([,n])=>n);const lead=PARTY.leader===MYUID;
  el.innerHTML=`<span>🤝 ${names.length?'和 '+esc(names.join('、')):'等隊友加入…'} · ${lead?'👑 你帶路':'跟著 '+esc(PARTY.members[PARTY.leader]||'隊長')}</span>${lead&&names.length?'<button id="ptPass">換人帶路</button>':''}<button id="ptLeave">離開</button>`;el.style.display='flex';
  const pp=$('#ptPass');if(pp)pp.onclick=passLead;$('#ptLeave').onclick=()=>leaveParty(false);}
/* 台灣官方景點照片：交通部觀光署觀光資訊資料庫（政府資料開放授權條款第1版），照片已存進網站 */
let TWPH=null;async function twPhotos(){if(TWPH)return TWPH;try{TWPH=await (await fetch('data/tw_photos.json',{cache:'force-cache'})).json();}catch(e){TWPH=[];}return TWPH;}
async function officialNear(sp){if((REGIONS[S.region]?.c||'TW')!=='TW'&&!(sp.lat>21.8&&sp.lat<26.5&&sp.lng>118&&sp.lng<122.2))return[];const L=await twPhotos();const base=(sp.n||'').replace(/ 附近$/,'');
  return L.map(r=>({r,d:hav(sp,{lat:r[1],lng:r[2]}),hit:base&&(r[0].includes(base)||base.includes(r[0]))})).filter(o=>o.hit?o.d<5:o.d<.15).sort((a,b)=>(b.hit-a.hit)||(a.d-b.d)).filter((o,i,arr)=>!arr.some(x=>x.hit)||o.hit).slice(0,6)
    .map(({r})=>({url:r[3],thumb:r[3],credit:'照片：'+(r[4]||r[0])+'／交通部觀光署觀光資訊資料庫',t:'tw:'+r[3],official:true}));}
/* 熱門照片：只記「哪個景點用了哪張 Unsplash／維基照片」的次數，不存任何個人資料 */
const popCell=sp=>'c'+hashStr((sp.n||'').replace(/ 附近$/,'')+':'+(+sp.lat).toFixed(2)+','+(+sp.lng).toFixed(2));
const popOK=u=>typeof u==='string'&&u.length<600&&(u.startsWith('https://images.unsplash.com/')||u.startsWith('https://upload.wikimedia.org/'));
function popVote(sp,c,w){if(!db||!MYUID||!sp||!c||!popOK(c.url))return;const id='p'+hashStr(c.url);const ref=db.ref('pop/'+popCell(sp)+'/'+id);
  ref.child('u').once('value').then(x=>{if(!x.exists())return ref.update({u:c.url,th:popOK(c.thumb)?c.thumb:c.url,cr:String(c.credit||'').slice(0,79)});}).catch(()=>{}).finally(()=>{ref.child('votes/'+MYUID).set(w).catch(()=>{});});}
async function popList(sp){if(!db)return[];try{const x=await db.ref('pop/'+popCell(sp)).once('value');const v=x.val()||{};
  return Object.values(v).filter(o=>o&&popOK(o.u)).map(o=>({url:o.u,thumb:popOK(o.th)?o.th:o.u,credit:(o.cr?o.cr+' · ':'')+'🔥 大家最愛',sc:Object.values(o.votes||{}).reduce((a,b)=>a+(+b||0),0)})).filter(o=>o.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,6);}catch(e){return[];}}
function othersTeam(o){return(Array.isArray(o.t)?o.t:[]).filter(x=>x&&typeof x.i==='string'&&x.i.startsWith('data:image/')).map(x=>({img:x.i,type:x.p?'人':'狗'}));}
function renderOthers(){for(const k in markers)if(!others[k]){map.removeLayer(markers[k]);delete markers[k];}
  for(const[k,o]of Object.entries(others)){if(S.blocked?.[k]||typeof o.lat!=='number'||typeof o.lng!=='number')continue;
    const html=teamHTML(othersTeam(o),String(o.n||'朋友').slice(0,16)+' · 真人',!!o.m,MODES[o.m]?o.m:'');
    const icon=L.divIcon({className:'',html:`<div style="transform:translate(-50%,-100%);opacity:.95">${html}</div>`,iconSize:[0,0]});
    if(!markers[k]){markers[k]=L.marker([o.lat,o.lng],{icon}).addTo(map);markers[k].on('click',()=>openMeet(k,null));}else{markers[k].setLatLng([o.lat,o.lng]);markers[k].setIcon(icon);}}}
function checkMeet(p){if(!db||!J)return false;for(const[k,o]of Object.entries(others)){if(J.met.has(k)||typeof o.lat!=='number')continue;
    if(hav(p,{lat:o.lat,lng:o.lng})<.15){J.met.add(k);SVs.paused=true;openMeet(k,()=>{if(SVs){SVs.paused=false;svNext();}});return true;}}return false;}
function openMeet(k,resume){const o=others[k];if(!o)return;const nm=String(o.n||'朋友').slice(0,16);const t=othersTeam(o);meetResume=resume;
  openSheet(`<div class="meet">${t[0]?`<img src="${t[0].img}" alt="">`:'<div style="font-size:70px">🐕</div>'}<h2>${resume?'路上遇到 ':''}${esc(nm)}</h2><p class="sub">他們也正在遛狗</p>
  <div class="acts"><button data-a="woof"><span>🐶</span>汪一聲</button><button data-a="hi"><span>👋</span>揮揮手</button><button data-a="heart"><span>💛</span>送愛心</button></div><button class="big" id="walkTogether">🤝 邀請一起走</button><button class="ghost" id="bye">${resume?'繼續走':'掰掰'}</button><button class="ghost" id="blk" style="margin-top:6px;font-size:12px;opacity:.7">🚫 不要再收到這隊的招呼</button></div>`,true);
  $('#walkTogether').onclick=()=>{inviteWalk(k,nm);done();};
  $('#blk').onclick=()=>{S.blocked=S.blocked||{};S.blocked[k]=1;save();toast('好的，不會再看到他們的招呼');done();};
  const done=()=>{closeSheet();const f=meetResume;meetResume=null;f&&f();};
  $('#sheet').querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{if(MYUID)db.ref('woofs/'+k).push({a:b.dataset.a,from:(S.teamName||'').slice(0,16),by:MYUID,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
    S.stats.met[k]={n:nm};save();toast('已經送給 '+nm);done();});$('#bye').onclick=done;}

/* ================= 開始 ================= */
function updateHere(){const r=REGIONS[S.region]||REGIONS.taipei;let near=null,nd=1e9;for(const s of SPOTS){const d=hav(S.pos,s);if(d<nd){nd=d;near=s;}}
  $('#teamName').textContent=S.teamName||'雲端遛狗';$('#here').textContent='📍 '+r.n+(COUNTRY[r.c]&&r.c!=='TW'?'（'+COUNTRY[r.c]+'）':'')+(near&&nd<3?' · '+(nd<.25?near.n:near.n+'附近'):'');
  $('#av').innerHTML=S.team[0]?`<img src="${S.team[0].img}" alt="">`:'🐕';if(window.checkSnapRef)checkSnapRef(false);}
drawMe();updateHere();syncLabels();drawFoods();drawTemples();initFirebase();vitals();updateWeather(S.pos,false);checkAch();if(!FIREBASE)$('#online').style.display='none';setTimeout(()=>checkSnap(false),800);
if(!S.team.length)setTimeout(()=>openTeam(true),400);
</script>
